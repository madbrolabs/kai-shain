<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KAI Lab 社員ページ</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1f24;--sub:#6a6f78;--line:#e3dfd6;--acc:#1f6f5c;--acc2:#e8f2ee;--warn:#9a4b16;--warn2:#fbefe5}
@media (prefers-color-scheme:dark){:root{--bg:#15171b;--card:#1e2127;--ink:#e9eaec;--sub:#9aa0aa;--line:#30343c;--acc:#5cc3a6;--acc2:#1d322c;--warn:#f0a66c;--warn2:#3a281b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
header b{font-size:17px;letter-spacing:.04em}
header .sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:900px;margin:0 auto;padding:16px}
.mon{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
.mon h1{font-size:20px;margin:0 0 6px}
.mon p{color:var(--sub);margin:0 0 16px;font-size:14px}
.mon input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.mon button{width:100%;margin-top:12px;background:var(--acc);color:#fff;border-color:var(--acc);padding:10px}
.err{color:var(--warn);font-size:14px;min-height:1.5em;margin-top:8px}
.heya{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:transform .1s}
.card:hover{transform:translateY(-2px)}
.card h2{font-size:18px;margin:0 0 4px}
.card .hk{color:var(--sub);font-size:14px;margin:0 0 10px}
.card .kazu{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.card .kazu span{background:var(--acc2);color:var(--acc);border-radius:99px;padding:1px 9px}
.card .ima{font-size:13px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.tabs button{white-space:nowrap;font-size:14px}
.ichi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.ichi .hi{font-size:12px;color:var(--sub)}
.ichi .moto{font-size:11px;color:var(--sub);float:right;display:flex;gap:6px;align-items:center}
.ichi .gb{font-size:11px;padding:0 7px;border-radius:99px;line-height:1.7;color:var(--sub)}
.ichi .gb.on{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
.ichi .genbun{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg);color:var(--sub);font-size:13px;border:1px dashed var(--line)}
.ichi.hiraki .genbun{display:block}
.ichi.dame{border-left:4px solid var(--warn)}
.ichi.dame .naze{background:var(--warn2);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:14px}
.ichi h3{font-size:15px;margin:2px 0}
.hibi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px 6px;margin:10px 0}
.hibi-h{font-weight:700;color:var(--acc);font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.hibi-h span{font-size:12px;color:var(--sub);font-weight:400}
.hibi ul{margin:6px 0 0;padding-left:1.2em}
.hibi li.ichi{background:none;border:0;border-radius:0;padding:6px 0;margin:0;border-top:1px dashed var(--line)}
.hibi li.ichi:first-child{border-top:0}
.hibi li.ichi .hi{margin-right:6px}
.hibi li.ichi>div,.hibi li.ichi>h3{display:inline}
.hibi li.ichi .genbun{display:none}.hibi li.ichi.hiraki .genbun{display:block}
/* 部屋の頭：2列にせず上から1列（題と説明→創始者の思い横幅いっぱい→中身）。2列だと左の下が白く空く（2026-11-25 社長「この何も書いてない白い部分は」） */
.atama{display:block;margin-bottom:6px}
.omoi{background:linear-gradient(135deg,var(--acc2),var(--card));border:1px solid var(--acc);border-radius:16px;padding:14px 20px;margin:4px 0 12px}
.omoi-h{color:var(--acc);font-weight:700;font-size:14px;letter-spacing:.1em;margin-bottom:6px}
.omoi p{font-size:20px;line-height:1.7;font-weight:700;margin:0 0 6px}
.omoi-s{text-align:right;color:var(--sub);font-size:13px}
@media (max-width:640px){.omoi p{font-size:17px}}
/* 一覧の一番上の大きな札（2026-11-25 社長「まずここ見てください、ドーンと色変えて」） */
a.mazu{display:block;margin:0 0 14px;padding:16px 20px;border-radius:16px;text-decoration:none;color:#3a1d00;background:#ffd23f;border:3px solid #e0a100;box-shadow:0 3px 12px rgba(224,161,0,.25)}
a.mazu b{display:block;font-size:24px;line-height:1.4}
a.mazu span{display:block;font-size:16px;line-height:1.55;margin-top:2px}
a.mazu:hover,a.mazu:focus{border-color:#b37f00}
.hibi.mt{padding:12px 16px}
.mt-m{font-size:18px;margin:6px 0 4px}
.mt-t{margin:0 0 6px;padding-left:1.2em}.mt-t li{margin:3px 0;line-height:1.6}
.hibi.mt details{margin:4px 0 6px;font-size:14px}.hibi.mt summary{color:var(--sub);cursor:pointer}
.mi{display:flex;gap:8px;align-items:center;margin:4px 0 6px}
.mi h1{font-size:22px;margin:0}
.mi .hk{color:var(--sub);font-size:14px}
input.sagasu{width:100%;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:6px}
.kara{color:var(--sub);padding:20px;text-align:center}
.shita{color:var(--sub);font-size:12px;text-align:center;margin:24px 0}
.mae{font-size:14px;margin-bottom:8px}
.yaru{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:0 0 18px}
.yaru a{display:block;text-decoration:none;color:inherit;background:linear-gradient(135deg,var(--acc2),var(--card));border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:transform .1s}
.yaru a:hover{transform:translateY(-2px)}
.yaru b{display:block;font-size:16px;color:var(--acc)}
.yaru span{font-size:13px;color:var(--sub)}
.tana{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tana .sr{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tana .sr .e{aspect-ratio:16/10;background:var(--acc2);overflow:hidden;border-bottom:1px solid var(--line)}
.tana .sr .e img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.tana .sr .ui{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.tana .sr h3{margin:0;font-size:16px}
.tana .sr p{margin:0;font-size:13.5px;color:var(--sub)}
.tana .sr .fu{font-size:12px;color:var(--sub)}
.tana .sr .fu b{color:var(--acc);font-weight:600;margin-right:6px}
.tana .sr .bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.tana .sr .bt a{text-decoration:none;font-size:13.5px;font-weight:700;border-radius:99px;padding:5px 14px;border:1px solid var(--acc);color:var(--acc)}
.tana .sr .bt a.hi{background:var(--acc);color:var(--card)}
.dekiru{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--acc2);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.dekiru .s{font-size:13px;color:var(--sub);flex:1 1 220px}
a.bt,button.bt{display:inline-block;text-decoration:none;background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:10px;padding:6px 14px;font-size:14px}
a.bt.s,button.bt.s{background:var(--card);color:var(--acc)}
.bt[disabled]{opacity:.55;cursor:default}
.fuda{display:inline-block;font-size:12px;border-radius:99px;padding:0 9px;margin-right:6px;border:1px solid var(--line)}
.fuda.kari{background:var(--warn2);color:var(--warn);border-color:var(--warn)}
.fuda.saiyou{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
.fuda.miokuri{color:var(--sub)}
.fuda.kenpin{background:var(--acc);color:#fff;border-color:var(--acc)}
.kou{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fuda.soudan{background:var(--warn);color:#fff;border-color:var(--warn)}
.ichi.soudan{border-left:4px solid var(--warn)}
.mittsu{margin-top:6px;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
.mittsu b{color:var(--sub);font-weight:600;white-space:nowrap}
.kou-h{font-size:19px;margin:22px 0 4px}
.kou-s{color:var(--sub);font-size:13px;margin-bottom:6px}
.sumi1{padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sumi1 .yoi{color:var(--acc)}
.form label{display:block;font-size:14px;margin:10px 0 4px}
.form input,.form textarea{width:100%;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form textarea{min-height:90px}
.md{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 20px 16px}
.md img{max-width:100%;border-radius:12px;display:block;margin:6px 0}
.md table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md code{background:var(--bg);border-radius:4px;padding:0 4px;font-size:.92em;word-break:break-all}
.md blockquote{margin:8px 0;padding:4px 12px;border-left:4px solid var(--acc);color:var(--sub)}
.md blockquote.mejirushi{color:inherit;background:rgba(31,140,90,.10);border-left-color:#1f8c5a;border-radius:0 10px 10px 0;padding:8px 14px;font-size:1.02em}
.md h1{font-size:22px}.md h2{font-size:18px;margin-top:22px}.md h3{font-size:16px}
/* 一覧の頭の2つの課（大きな切り替え） */
.bu-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:6px 0 0}
.bu-tabs button{font:inherit;text-align:left;cursor:pointer;min-width:0;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 14px 12px;overflow-wrap:anywhere}
.bu-tabs button b{display:block;font-size:clamp(17px,4.6vw,23px);line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.bu-tabs button b i{display:block;font-style:normal;font-size:1.3em;line-height:1.2;margin-bottom:2px}
.bu-tabs button span{display:block;font-size:12.5px;color:var(--sub);margin-top:4px}
.bu-tabs button.on{border-color:var(--acc);background:var(--acc);color:#fff}
.bu-tabs button.on span{color:rgba(255,255,255,.85)}
section.bu{border:2px solid var(--acc);border-radius:16px;padding:14px;margin:10px 0 18px;min-width:0}
.bu-s{color:var(--sub);margin:0 0 12px}
.bu-h{font-size:16px;margin:20px 0 8px;color:var(--acc)}
.mazu.bu-yaru{margin:14px 0 0}
.ts-in{display:inline-block;border-radius:99px;padding:0 9px;font-size:12px;font-weight:700;background:var(--acc2);color:var(--acc);margin:0 6px 6px 0}
#bu-irig .ts-l{margin-top:12px}
.kan-kuchi{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:2px dashed var(--acc);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.kan-kuchi .s{font-size:13px;color:var(--sub);flex:1 1 220px}
/* 部署のページ：広い時は表、狭い時は1行ずつの札。形が崩れた表は元の字のまま */
.busho{overflow-wrap:anywhere}
.busho table.fuda-t{display:table;table-layout:fixed}
.busho .fuda-t th{background:var(--bg)}
.busho pre.nama{white-space:pre-wrap;word-break:break-word;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px}
@media (max-width:640px){
.md.busho{padding:4px 12px 12px}
.busho table.fuda-t,.busho .fuda-t tbody,.busho .fuda-t tr,.busho .fuda-t td{display:block;width:100%}
.busho .fuda-t thead{display:none}
.busho .fuda-t tr{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:6px 10px;background:var(--card)}
.busho .fuda-t td{border:0;padding:3px 0}
.busho .fuda-t td::before{content:attr(data-h);display:block;font-size:12px;font-weight:700;color:var(--sub)}
}
.shorui-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
@media (prefers-color-scheme:dark){header .lg{filter:invert(1) hue-rotate(180deg) brightness(1.6)}}
.tsutsumi-b{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.tsutsumi-b button{padding:10px 14px;border-radius:8px;border:1px solid var(--line,#ccc);background:transparent;color:inherit;font-size:15px}.tsutsumi-b .shu{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:bold}#kopi-k{color:var(--sub);font-size:14px}
.kopi-blk{position:relative;margin:10px 0}.kopi-blk pre{white-space:pre-wrap;word-break:break-word;background:rgba(127,127,127,.12);border:1px solid rgba(127,127,127,.3);border-radius:8px;padding:44px 12px 12px;font-size:14px;line-height:1.7;margin:0}.kopi-b{position:absolute;top:8px;right:8px;padding:6px 14px;border-radius:6px;border:0;background:#2563eb;color:#fff;font-weight:bold;font-size:14px;cursor:pointer}.kopi-k{position:absolute;top:8px;left:12px;right:96px;font-size:13px;line-height:1.35;color:var(--sub)}
.kopi-blk.sanka .kopi-b{font-size:16px;padding:8px 18px}.kopi-blk.sanka pre{padding-top:60px}.kopi-blk.sanka .kopi-k{top:14px;right:110px}
body.kyo-ari #m{padding-bottom:96px}.sanka-n{font-size:13px;color:var(--sub);margin:4px 2px 0}
/* チャット部屋の小窓（2026-11-27 社長「社員ページの端っこのほうに常に出しておいて。ドラッグで動かせる感じで、最小化ボタンつき」） */
#kyo{position:fixed;z-index:900;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.28);overflow:hidden}
#kyo[hidden],#kyo-maru[hidden]{display:none}
#kyo-bar{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;background:var(--acc);color:#fff;cursor:move;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
#kyo-bar b{font-size:15px}#kyo-bar .sp{flex:1}
#kyo-bar a,#kyo-bar button{color:#fff;background:rgba(255,255,255,.18);border:0;border-radius:8px;width:34px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;text-decoration:none;cursor:pointer;padding:0}
#kyo-naka{flex:1;min-height:0;display:flex}#kyo-naka iframe{flex:1;border:0;width:100%;height:100%;background:var(--bg)}
#kyo.ugoku iframe{pointer-events:none}
#kyo-naka{position:relative}#kyo-dame{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}#kyo-dame a{font-weight:bold;color:var(--acc)}
.kyo-ire{padding:16px;font-size:15px;line-height:1.6;width:100%}.kyo-ire input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:8px 0}.kyo-ire button{padding:10px 22px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.kyo-ire .err{color:#d33;font-size:14px;margin-top:6px;min-height:1.2em}
#kyo-maru{position:fixed;z-index:900;right:16px;bottom:16px;width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:pointer;padding:0}
#kyo-ten{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#ff3b30;border:2px solid #fff}
.tsutsumi-n{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}.tsutsumi-n label{font-weight:bold}.tsutsumi-n input{flex:1;min-width:0;max-width:260px;padding:10px 12px;font-size:16px;border-radius:8px;border:1px solid rgba(127,127,127,.5);background:transparent;color:inherit}
.yaritai{margin:26px 0 0}.yaritai h2.ym{font-size:19px;margin:0 0 2px}.yaritai .ys{color:var(--sub);font-size:14px;margin:0 0 10px}
.yfuda{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.yf{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:14px;padding:16px;font-size:14.5px;line-height:1.7;min-width:0;overflow-wrap:anywhere}
.yf h3{font-size:18px;margin:0 0 4px}.yf .yh{margin:0 0 10px}.yf .yd{font-size:12.5px;font-weight:700;color:var(--sub);margin:12px 0 2px}
.yf .ykk{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:0}.yf .ykk dt{font-weight:700;white-space:nowrap}.yf .ykk dd{margin:0}
.yf ul{margin:0;padding-left:1.2em}.yf .ydan{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700}
.yf .ydare{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
a.mazu.shin{background:#dbeafe;border-color:#2563eb;color:#0b2a5b;box-shadow:none}a.mazu.shin b{font-size:20px}a.mazu.shin i{font-style:normal;font-weight:bold;word-break:break-all}
/* テスト中のアプリ・感想・パスワード（2026-11-27 社長「スマホしかない人は アプリのテストをしてもらう」） */
.ts-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ts{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:14px;padding:14px 16px;min-width:0;overflow-wrap:anywhere}
.ts h3{font-size:19px;margin:0 0 2px}.ts .hk{color:var(--sub);font-size:14.5px;margin:0 0 10px}
.ts .bt2{display:flex;flex-wrap:wrap;gap:8px}.ts .bt2 a,.ts .bt2 button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:10px;font:inherit;font-weight:bold;font-size:15px;text-decoration:none;cursor:pointer}
.ts .ire{background:var(--acc);color:#fff;border:1px solid var(--acc)}.ts .kan{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.ts .ch{font-size:13px;color:var(--sub);margin-top:8px}
.kf textarea{width:100%;min-height:150px;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.kf .fu2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.kf .fu2 button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.kf .okuru{font:inherit;font-weight:bold;font-size:17px;padding:10px 28px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.kf .err{color:#d33;font-size:14px;min-height:1.3em;margin-top:6px}.kf .yoi{color:var(--acc);font-weight:bold;margin-top:6px}
.chips{display:flex;flex-direction:column;gap:6px}.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px}
.chip img{width:44px;height:44px;object-fit:cover;border-radius:6px}.chip.dame{border-color:#d33}.chip .cn{overflow-wrap:anywhere}.chip .cj{font-size:12.5px;color:var(--sub)}.chip .cx{margin-left:auto;border:0;background:transparent;color:var(--sub);font-size:18px;cursor:pointer}
.kj{border-top:1px dashed var(--line);padding:8px 0;font-size:14.5px}.kj .hi{color:var(--sub);font-size:13px}.kj div{white-space:pre-wrap}

<body>
<header><a href="../" style="display:flex"><img src="../img/kai_logo_s.png" alt="KAI" style="height:30px;width:auto" class="lg"></a><b>社員ページ</b><span class="sp"></span><span id="who" style="font-size:13px;color:var(--sub)"></span><button id="deru" hidden>出る</button></header>
<main id="m"><div class="kara">ひらいています…</div></main>
<div id="kyo" hidden role="dialog" aria-label="チャット部屋"><div id="kyo-bar"><b>💬 チャット部屋</b><span class="sp"></span><a id="kyo-oo" href="#" target="_blank" rel="noopener" title="大きく開く" aria-label="大きく開く" hidden>↗</a><button id="kyo-min" type="button" title="小さくする" aria-label="小さくする">＿</button></div><div id="kyo-naka"></div></div>
<button id="kyo-maru" type="button" hidden aria-label="チャット部屋を開く" title="チャット部屋">💬<i id="kyo-ten" hidden></i></button>
<!-- 起動の一瞬（全社の型＝起動ロゴ 1.2.1。正本 C:\cl\gijiroku\kidou_logo\web\kidou_logo.js から写した物・中は書き換えない。名前は部品が自分で1行に収める。雰囲気を選ぶ口＝部屋の一覧の下の「起動の画面」） -->
<script src="kidou_logo.js"></script>
<script>try{KidouLogo.dasu({namae:"社員ページ",yomi:"KAI STAFF",seishiki:"",nanori:"社員ページ、起動。",fuun:"kinmirai"})}catch(e){}</script>
<script>
"use strict";
const $=s=>document.querySelector(s), M=$("#m");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ub=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const LS="kai_shain_aikotoba";
// ID とパスワードの入口（門番の /kai/shain/・2026-11-27 社長「普通にIDとPASSで入る方式に」）。門番がこの1行を true にして出す
const IDMODE=false;
const SHIN="";  // 前のアドレスで ID の入口に来た時だけ、門番が新しい住所（…/kai/）を入れて出す（2026-11-28 新しい住所へ）
let ORE=null;  // ID の形で入っている人（名前・見える箱・初めのパスワードのままか）
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const put=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let D=null;

async function hiraku(aik){
  if(IDMODE){const r=await fetch("/kai/api/hako",{cache:"no-store"});if(r.status===401)return null;if(!r.ok)throw new Error("hako "+r.status);return await r.json()}
  const r=await fetch("data.enc.json?t="+Date.now(),{cache:"no-store"});
  const box=await r.json();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(aik.normalize("NFKC").trim()),"PBKDF2",false,["deriveKey"]);
  for(const w of box.wraps){
    try{
      const W=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(w.salt),iterations:box.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
      const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(w.iv)},W,ub(w.k));
      const K=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
      for(const h of (box.hako||[{iv:box.iv,ct:box.ct}])){
        try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(h.iv)},K,ub(h.ct));return JSON.parse(new TextDecoder().decode(pt))}catch(e){}
      }
    }catch(e){}
  }
  return null;
}

let KID="";
function mon(msg){
  $("#deru").hidden=true;kyoKesu();$("#who").textContent="";
  if(IDMODE){
    M.innerHTML=`<div class="mon"><h1>社員の入口</h1><p>社長から届いた ID（例：社長、または shachou）とパスワードを入れてください。この端末では、「ログアウト」を押すまで入ったままです。</p>
    <input id="kid" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ID" value="${esc(KID)}" style="margin-bottom:10px">
    <input id="aik" autocomplete="current-password" type="password" placeholder="パスワード"><button id="go">入る</button><div class="err">${esc(msg||"")}</div>${SHIN?`<p style="margin-top:14px;font-size:13px;color:var(--sub)">🔑 住所が新しくなりました。これからは <a href="${esc(SHIN)}">${esc(SHIN)}</a> から入ってください（このアドレスも、しばらくは使えます）。</p>`:""}</div>`;
    const go=async()=>{const i=$("#kid").value.trim(),p=$("#aik").value;if(!i||!p)return;KID=i;$("#go").textContent="ひらいています…";$("#go").disabled=true;
      let j={};
      try{const r=await fetch("/kai/api/login",{method:"POST",headers:{"Content-Type":"application/json","X-KAI":"1"},body:JSON.stringify({id:i,pw:p})});j=await r.json().catch(()=>({}))}
      catch(e){return mon("つながりませんでした。電波を確かめて、もう一度どうぞ。")}
      if(!j.ok)return mon(j.naze||"入れませんでした。");
      ORE={namae:j.namae,kubun:j.kubun,shoki:j.shoki};KID="";await hairu("")};
    $("#go").onclick=go;$("#kid").onkeydown=$("#aik").onkeydown=e=>{if(e.key==="Enter")go()};(KID?$("#aik"):$("#kid")).focus();
    return}
  M.innerHTML=`<div class="mon"><h1>社員の入口</h1><p>KAI Lab の社員だけが読めるページです。配られた合言葉を入れてください。この機械では次から入れなくて済みます。</p>
  <input id="aik" autocomplete="current-password" type="password" placeholder="合言葉"><button id="go">入る</button><div class="err">${esc(msg||"")}</div></div>`;
  const go=async()=>{const v=$("#aik").value;if(!v)return;$("#go").textContent="ひらいています…";await hairu(v)};
  $("#go").onclick=go;$("#aik").onkeydown=e=>{if(e.key==="Enter")go()};$("#aik").focus();
}

async function hairu(aik){
  let d=null;
  try{d=await hiraku(aik)}catch(e){return mon("ページを読めませんでした。電波を確かめて、もう一度どうぞ。")}
  if(!d){if(IDMODE)return mon("");put(LS,null);return mon("合言葉が違うようです。")}
  if(IDMODE){if(!ORE){try{const j=await (await fetch("/kai/api/ore",{cache:"no-store"})).json();if(j.ok)ORE=j}catch(e){}}
    await bushoYomu();
    $("#who").textContent=ORE?"👤 "+ORE.namae:"";$("#deru").textContent="ログアウト"}
  else put(LS,aik);
  D=d;$("#deru").hidden=false;kyoDasu();
  const m=location.hash.match(/h=([^&]+)&t=([^&]*)/), v=location.hash.match(/v=([^&]+)(?:&i=([^&]*))?/);
  m?heya(decodeURIComponent(m[1]),m[2],0):v?miseru({v:v[1],i:decodeURIComponent(v[2]||"")}):ichiran(0);
}

// 進みはまとめがあれば「日の数」で数える
const KZ=(h,k)=>k==="susumi"&&(h.susumi_matome||[]).length?h.susumi_matome.length:(h[k]||[]).length;
// 記録の欄（進み・出来た事・ダメ出し・小話・決まった事・採らなかった案・工事日誌）を画面に出すか。集める係（atsume）は止めない＝true に戻せばまた出る
// （2026-11-28 社長「この進みとかダメ出しとか、なんかこの意味のわからない、この変なやつ、表示するのやめましょう」）
const KIROKU_MISERU=false;
const KIND=[["susumi","進み"],["houkoku","出来た事"],["dameshi","ダメ出しと学び"],["kobanashi","開発の小話"],["kimatta","決まった事"],["fusaiyou","採らなかった案"],["omoi","創始者の思い"],["commit","工事日誌"]];

// 画面の移り変わりを履歴に積む＝マウスやブラウザの「戻る」で前の画面へ
function iku(st,push){const u=location.pathname+(st.v==="heya"?`#h=${st.i}&t=${st.t||""}`:st.v!=="ichiran"?`#v=${st.v}${st.i?"&i="+encodeURIComponent(st.i):""}`:"");push?history.pushState(st,"",u):history.replaceState(st,"",u)}
function miseru(st){if(!D)return;const v=st&&st.v;v==="heya"?heya(st.i,st.t,0):v==="kousin"?kousin(0):v==="yomu"?yomu(st.i,0):v==="tsutsumi"?tsutsumi(0):v==="shorui"?shorui(st.i,0):v==="eigyou"?eigyou(0)
  :v==="busho"?busho(st.i,0):v==="tesuto"?tesuto(0):v==="kansou"?kansou(st.i,0):v==="pw"?pwKaeru(0):ichiran(0)}
// アドレスの # から画面を読む（文の中の「#v=tesuto」のリンクを押した時など、履歴に画面が無い時）
function hashSt(){const h=location.hash.match(/h=([^&]+)&t=([^&]*)/),v=location.hash.match(/v=([a-z]+)(?:&i=([^&]*))?/);
  return h?{v:"heya",i:decodeURIComponent(h[1]),t:h[2]}:v?{v:v[1],i:decodeURIComponent(v[2]||"")}:null}
addEventListener("popstate",e=>miseru(e.state||hashSt()));
// 起動の画面を選ぶ口（全社の型 2.5）：ボタンの数と名前は部品から取る。選んだ物は端末が覚え、次に開いた時から変わる
function kidouKuchi(){
  const K=window.KidouLogo, el=$("#kidou-kuchi");
  if(!el)return;
  if(!K||!K.fuun||!K.erabu){el.hidden=true;return}
  const ima=K.erabareta()||"kinmirai";
  el.innerHTML=`<span>起動の画面</span>`+K.fuun.map(f=>`<button class="bt${f===ima?"":" s"}" data-f="${esc(f)}" aria-pressed="${f===ima}">${esc((K.namae&&K.namae[f])||f)}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{K.erabu(b.dataset.f);kidouKuchi()});
}
// 「やりたい人がいたら進めてね」の段（社長が置いた種の札。札は内緒の場所の表 yaritai.json に1項目足すだけで増える）
function yaritaiDan(Y){
  const fs=(Y&&Y.fuda)||[];
  if(!fs.length)return "";
  const fuda=f=>`<div class="yf" data-id="${esc(f.id)}"><h3>${esc(f.daimei)}</h3><p class="yh">${esc(f.hitokoto)}</p>
    ${f.imamade||f.korekara?`<div class="yd">今まで → これから</div><dl class="ykk">${f.imamade?`<dt>今まで</dt><dd>${esc(f.imamade)}</dd>`:""}${f.korekara?`<dt>これから</dt><dd>${esc(f.korekara)}</dd>`:""}</dl>`:""}
    ${(f.dekiru||[]).length?`<div class="yd">出来る事（はじめの形）</div><ul>${f.dekiru.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${f.okane_zero||f.okane_kakeru?`<div class="yd">お金</div><dl class="ykk">${f.okane_zero?`<dt>0円の道</dt><dd>${esc(f.okane_zero)}</dd>`:""}${f.okane_kakeru?`<dt>かける時</dt><dd>${esc(f.okane_kakeru)}</dd>`:""}</dl>`:""}
    ${f.dankai?`<div class="yd">今の段階</div><span class="ydan">${esc(f.dankai)}</span>${f.dankai_shousai?` <span class="hk">${esc(f.dankai_shousai)}</span>`:""}`:""}
    ${f.dare?`<div class="ydare">やりたい人は <b>${esc(f.dare)}</b> へ一声。${esc(f.dare_hitokoto||"")}</div>`:""}</div>`;
  return `<section class="yaritai"><h2 class="ym">${esc(Y.midashi||"やりたい人がいたら進めてね")}</h2>${Y.hitokoto?`<p class="ys">${esc(Y.hitokoto)}</p>`:""}<div class="yfuda">${fs.map(fuda).join("")}</div></section>`;
}
// 一覧の頭を2つの課に大きく分ける（2026-11-28 社長「営業部とソフトウェア開発課は…デカデカとね、分けてほしい」）
// 課の名前とやる事一覧は門番の表 busho.json から（表に部署を1行足すと、ここにも課が1つ増える）。合言葉の入口では表が無いので、名前だけの2つ
const BU_KIHON=[{id:"kaihatsuka",namae:"ソフトウェア開発課",e:"💻",s:"ソフトの一覧と、開発のやる事"},{id:"eigyoubu",namae:"営業部",e:"💼",s:"ソフト以外のやる事と資料"}];
function buList(){
  const xs=BU_KIHON.map(b=>{const x=BUSHO.find(y=>y.id===b.id);return {...b,namae:x?x.namae:b.namae,ari:!!x}});
  BUSHO.filter(x=>!BU_KIHON.some(b=>b.id===x.id)).forEach(x=>xs.push({id:x.id,namae:x.namae,e:"📁",s:"やる事一覧",ari:true}));
  return xs;
}
let BU_IMA=(()=>{try{return localStorage.getItem("kai_bu")||"kaihatsuka"}catch(e){return "kaihatsuka"}})();
function ichiran(push=1){
  iku({v:"ichiran"},push);
  window.scrollTo(0,0);
  const rooms=D.soft.map((h,i)=>{
    const mt=(h.susumi_matome||[])[0], ima=mt?{hi:mt.hi,text:mt.midashi}:(h.susumi[0]||h.houkoku[0]||{});
    const sk=SK(h.id);
    return `<div class="card" data-i="${i}" data-id="${esc(h.id)}"><h2>${esc(h.namae)}</h2><p class="hk">${esc(h.hitokoto)}</p>${sk&&sk.joutai?`<span class="sk-jou${sk.joutai==="本番"?" honban":""}">${esc(sk.joutai)}</span>`:""}
    ${!KIROKU_MISERU?"":`<div class="kazu">${KIND.filter(([k])=>h[k].length).map(([k,n])=>`<span>${n} ${KZ(h,k)}</span>`).join("")}</div>
    ${ima.text||ima.daimei?`<div class="ima">いま：${(()=>{const t=Y(ima,"text")||Y(ima,"daimei");return esc((t.startsWith(ima.hi)?t:ima.hi+" "+t).slice(0,80))})()}…</div>`:""}`}</div>`}).join("");
  const H=D.hoka||{}, tb=H.tebiki||[];
  const HJ="0_はじめての人の入口", hj=tb.find(x=>x.id===HJ);
  // 札の中身：[押した時の印, 名前, ひとこと]。手引きの「主任向け…」は開発の道具なので開発課へ
  const tbFuda=x=>[`yomu:${x.id}`,x.md.match(/^# (.+)/m)?.[1].split("：")[0]||x.id,(x.md.match(/^# .+：(.+)/m)||[])[1]||""];
  const shunin=x=>x.id.startsWith("主任向け");
  // 2つの課に入らない物だけ、下の小さい札に残す（2026-11-28 社長「同じことを2箇所に書かないように、まとめていって」）
  const yaru=[...tb.filter(x=>x.id!==HJ&&!shunin(x)).map(tbFuda),
    IDMODE?["pw","パスワードを変える","自分だけのパスワードに替える"]:null].filter(Boolean);
  // 録音君の札は外した（2026-11-28：言霊エンジンの入れ方は超議事録の部屋の「入れ方」に載せた）
  // 「テスト中のアプリ」の札も外した（2026-11-28：試し方は各ソフトの部屋、感想は部屋の「✍ 感想を書く」、カードに「テスト中」の印）
  const dougu=[H.tsutsumi?["tsutsumi","AI に渡す包み",`自分の AI に読ませる1枚（版 ${H.tsutsumi.ban}）`]:null,
    H.mon?["kousin","届いた更新","みんなが出した仮の更新の一覧"]:null, ...tb.filter(shunin).map(tbFuda)].filter(Boolean);
  const eigyouFuda=[["eigyou","営業用資料","お客様に見せる紹介・プレゼン（開く・保存）"],
    (H.shorui||[]).length?["shorui",H.shorui_midashi||"会社設立へ向けて","いまの準備の書類"]:null].filter(Boolean);
  const fudaL=xs=>`<div class="yaru">${xs.map(([k,n,t,u])=>u?`<a href="${esc(u)}" target="_blank" rel="noopener"><b>${esc(n)}</b><span>${esc(t)}</span></a>`:`<a href="#" data-y="${esc(k)}"><b>${esc(n)}</b><span>${esc(t)}</span></a>`).join("")}</div>`;
  const yarukoto=b=>b.ari?`<a class="mazu bu-yaru" href="#" data-y="busho:${esc(b.id)}"><b>📋 ${esc(b.namae)}のやる事一覧</b><span>開くたびに、いちばん新しい一覧が出ます</span></a>`:"";
  const BU=buList(); if(!BU.some(b=>b.id===BU_IMA))BU_IMA=BU[0].id;
  const naka=b=>b.id==="kaihatsuka"?`<p class="bu-s">ソフトごとの部屋です。開くと、そのソフトが何か・何と何の組み合わせか・入れ方・使い方が見られます。どの部屋からも「試す」「開発に参加したい」ができます。「テスト中」の印のソフトは、部屋の「✍ 感想を書く」から感想を送れます。</p>

// このPC（Tailscale の内側）では、門番の住所が内側の番地に引かれ、公開の置き場のページから門番を呼ぶと Chrome が
// 「ローカルの相手」として止める（Local Network Access）。targetAddressSpace:"public" の試しは、内側なら知らせの窓を出さずに
// すぐ外れるので、それで見分ける。内側なら、同じページを門番の住所（/kai_mon/pages/shain/）で開き直す＝同じ所からの呼び出しになる。

async function uchiKa(m){

  try{

    const p=await navigator.permissions.query({name:"local-network-access"});  // この止めを持つブラウザだけ見分ける
    if(p.state==="granted")return UCHI;
    try{await fetch(m.url+"/kai_mon/genki",{mode:"no-cors",cache:"no-store",targetAddressSpace:"public"})}catch(e){UCHI=true}

  return UCHI;

  if(await uchiKa(m)){monHe(m);throw new Error("このPCでは門番の住所で開き直しています…")}

  const j=await r.json().catch(()=>({ok:false,err:"返事を読めませんでした"}));

function md(t,kata){
  const il=s=>esc(s).replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,u)=>/^(\.\.\/|https:)/.test(u)?`<img src="${u}" alt="${a}" loading="lazy">`:"")

    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const L=t.replace(/\r/g,"").split("\n"), o=[];let i=0;
  while(i<L.length){
    const l=L[i];

    if(/^#{1,4} /.test(l)){const n=l.match(/^#+/)[0].length;o.push(`<h${n}>${il(l.slice(n+1))}</h${n}>`);i++;continue}
    if(/^\|/.test(l)){const rs=[];while(i<L.length&&/^\|/.test(L[i]))rs.push(L[i++]);
      const c=r=>r.replace(/^\||\|$/g,"").split("|").map(x=>x.trim());

        const hd=c(hon[0].trim());

      o.push("<table>"+rs.filter(r=>!/^\|[\s:|-]+\|$/.test(r)).map((r,k)=>"<tr>"+c(r).map(x=>k?`<td>${il(x)}</td>`:`<th>${il(x)}</th>`).join("")+"</tr>").join("")+"</table>");continue}
    if(/^\s*([-*]|\d+\.) /.test(l)){const ol=/^\s*\d+\./.test(l), it=[];while(i<L.length&&/^\s*([-*]|\d+\.) /.test(L[i]))it.push(L[i++].replace(/^\s*([-*]|\d+\.) /,""));
      o.push(`<${ol?"ol":"ul"}>${it.map(x=>`<li>${il(x)}</li>`).join("")}</${ol?"ol":"ul"}>`);continue}
    if(/^> ?/.test(l)){const b=[];while(i<L.length&&/^> ?/.test(L[i]))b.push(L[i++].replace(/^> ?/,""));o.push(`<blockquote${/^✅/.test(b[0])?' class="mejirushi"':""}>${b.map(il).join("<br>")}</blockquote>`);continue}

    w.style.left=Math.max(8,Math.min(e.clientX-s.dx,innerWidth-r.width-8))+"px";w.style.top=Math.max(8,Math.min(e.clientY-s.dy,innerHeight-r.height-8))+"px"});
  const owari=()=>{if(!s)return;s=null;w.classList.remove("ugoku");const j=kyoJ();j.x=parseFloat(w.style.left);j.y=parseFloat(w.style.top);kyoOku(j)};
  bar.addEventListener("pointerup",owari);bar.addEventListener("pointercancel",owari);
  $("#kyo-min").onclick=()=>{const j=kyoJ();j.chiisai=true;kyoOku(j);kyoMiseru()};
  $("#kyo-maru").onclick=()=>{const j=kyoJ();j.chiisai=false;kyoOku(j);kyoMiseru()};
  addEventListener("resize",()=>{if(!w.hidden)kyoBasho()});
  // 小さくしている間に新しい書き込みが来たら、丸に赤い点（広場が知らせてくる）
  addEventListener("message",e=>{const u=kyoU();if(!u||e.origin!==new URL(u).origin)return;
    if(e.data&&e.data.kai_kyo==="hiraita"){kyoNaka.hiraita=true;$("#kyo-dame")?.remove()}
    if(e.data&&e.data.kai_kyo==="atarashii"&&$("#kyo").hidden)$("#kyo-ten").hidden=false});
})();
kyoUketoru();addEventListener("hashchange",kyoUketoru);

function hashKara(){const m=location.hash.match(/(?:^#|&)k=([^&]+)/);if(!m)return false;const k=decodeURIComponent(m[1]);
  const nokori=location.hash.replace(/^#/,"").split("&").filter(x=>x&&!x.startsWith("k=")).join("&");  // 合言葉だけ消し、開いていた画面（v=・h=）は残す
  history.replaceState(null,"",location.pathname+(nokori?"#"+nokori:""));hairu(k);return true}
addEventListener("hashchange",hashKara);
if(IDMODE)hairu("");
else if(!hashKara()){const s=get(LS); s?hairu(s):mon();}
