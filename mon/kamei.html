<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>KAI Lab 部屋のようす</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1f24;--sub:#6a6f78;--line:#e3dfd6;--acc:#1f6f5c;--acc2:#e8f2ee;--warn:#9a4b16;--warn2:#fbefe5;--ai:#f3f1ec;--me:#e6efff;--me2:#2f5fb3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--card:#1e2127;--ink:#e9eaec;--sub:#9aa0aa;--line:#30343c;--acc:#5cc3a6;--acc2:#1d322c;--warn:#f0a66c;--warn2:#3a281b;--ai:#252830;--me:#1f2b42;--me2:#8fb3ff}}
:root[data-theme="dark"]{--bg:#15171b;--card:#1e2127;--ink:#e9eaec;--sub:#9aa0aa;--line:#30343c;--acc:#5cc3a6;--acc2:#1d322c;--warn:#f0a66c;--warn2:#3a281b;--ai:#252830;--me:#1f2b42;--me2:#8fb3ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--acc)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.logo{display:inline-flex;align-items:center;justify-content:center;border:2.5px solid var(--acc);border-radius:50%;width:58px;height:30px;font-weight:800;letter-spacing:.08em;color:var(--acc);font-size:14px;flex:none}
header.top h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modoru{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:15px;flex:none}
.chuui{background:var(--warn2);color:var(--warn);border-radius:12px;padding:10px 14px;margin:16px 0;font-size:15px}
h2{font-size:19px;margin:22px 0 10px}
.heya-ichiran{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.heya{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:box-shadow .2s,border-color .2s}
.heya:hover,.heya:focus{border-color:var(--acc);box-shadow:0 4px 18px rgba(31,111,92,.15)}
.heya b{font-size:18px;display:block}
.heya .s{color:var(--sub);font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ima{display:inline-block;font-size:13px;color:#fff;background:var(--acc);border-radius:999px;padding:0 9px;margin-left:6px;vertical-align:2px}
.seika{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.seika li{border-top:1px solid var(--line)}
.seika li:first-child{border-top:0}
.seika a,.seika .na{display:flex;gap:10px;align-items:baseline;padding:11px 14px;text-decoration:none;color:var(--ink)}
.seika a:hover{background:var(--acc2)}
.fuda{flex:none;font-size:12.5px;border-radius:6px;padding:0 7px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.fuda.k{background:var(--me);color:var(--me2)}
.seika .t{flex:1;min-width:0;overflow-wrap:anywhere}
.seika .h{flex:none;color:var(--sub);font-size:13px;white-space:nowrap}
.kara{color:var(--sub);font-size:14.5px;padding:14px}
/* 部屋の中 */
.tabs{display:none}
.naka{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;padding-top:14px;padding-bottom:16px}
.kaiwa-waku{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;height:calc(100vh - 100px);height:calc(100dvh - 100px);min-height:420px}
.kaiwa{flex:1;overflow-y:auto;padding:12px 12px 4px;overscroll-behavior:contain}
.mae{display:block;margin:4px auto 10px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:999px;padding:3px 14px;font-size:14px}
.m{margin:8px 0;display:flex;flex-direction:column}
.m .w{font-size:13px;color:var(--sub);margin:0 6px 2px}
.m .b{border-radius:14px;padding:9px 13px;max-width:92%;overflow-wrap:anywhere;word-break:normal}
.m.hito{align-items:flex-end}.m.hito .b{background:var(--acc2)}
.m.ai .b{background:var(--ai)}
.m.kamei{align-items:flex-end}.m.kamei .b{background:var(--me);border:1px solid var(--me2)}
.m .b p{margin:0 0 .5em}.m .b p:last-child{margin-bottom:0}
.m .b ul,.m .b ol{margin:.2em 0 .5em;padding-left:1.3em}
.m .b code{background:rgba(127,127,127,.15);border-radius:4px;padding:0 4px;font-size:.9em}
.m .b h3,.m .b h4{font-size:1em;margin:.4em 0 .2em}
.m .b table{border-collapse:collapse;font-size:.92em;display:block;overflow-x:auto}
.m .b td,.m .b th{border:1px solid var(--line);padding:2px 6px}
.sagyou{color:var(--sub);font-size:14px;margin:4px 8px}
details.shirase{margin:6px 0;font-size:15px;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:6px 12px}
details.shirase summary{cursor:pointer;color:var(--sub)}
details.shirase div{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}
.joutai{font-size:13px;color:var(--sub);margin:2px 6px 0}
.shita{position:relative}
.atarashii{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;border:0;background:var(--acc);color:#fff;border-radius:999px;padding:4px 16px;font-size:15px;display:none;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.kaku{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end}
.kaku textarea{flex:1;min-width:0;font:inherit;font-size:17px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;resize:none;height:52px;max-height:160px;background:var(--bg);color:var(--ink)}
.kaku button{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;flex:none}
.kaku button:disabled{opacity:.5}
.kaku-note{font-size:13px;color:var(--sub);padding:0 12px 8px}
.seika-waku{height:calc(100vh - 100px);height:calc(100dvh - 100px);overflow-y:auto}
.ugoki{font-size:14px;color:var(--sub);margin:0 2px 8px}
/* 読む */
.yomu{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
.yomu.hiraku{display:flex}
.yomu .naka2{flex:1;overflow-y:auto}
.yomu article{max-width:760px;margin:0 auto;padding:12px 16px 60px;overflow-wrap:anywhere}
.yomu article h1{font-size:22px}.yomu article h2{font-size:19px}.yomu article h3{font-size:17px}
.yomu article table{border-collapse:collapse;display:block;overflow-x:auto}
.yomu article td,.yomu article th{border:1px solid var(--line);padding:3px 8px}
.yomu article pre{white-space:pre-wrap;background:var(--card);padding:10px;border-radius:10px}
.yomu iframe{flex:1;border:0;width:100%;background:#fff}
/* 社長の入口 */
.tsukutta{display:grid;gap:10px}
.tk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15.5px}
.tk b{font-size:16.5px}
.tk .r{color:var(--sub);font-size:14px}
.tk .bt{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tk .bt button{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:6px 16px}
.tk .bt button.mi{background:transparent;color:var(--acc)}
@media (max-width:860px){
  .tabs{display:flex;gap:6px;padding-top:10px}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px;font-weight:700}
  .tabs button[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
  .naka{grid-template-columns:minmax(0,1fr);padding-top:10px}
  .naka>section{display:none}
  .naka>section.mieru{display:block}
  .naka>section.kaiwa-waku.mieru{display:flex}
  .kaiwa-waku,.seika-waku{height:calc(100vh - 128px);height:calc(100dvh - 128px)}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="logo">KAI</span>
  <h1 id="dai">部屋のようす</h1>
  <button class="modoru" id="modoru" hidden>← 部屋の一覧</button>
</div></header>

<main id="iriguchi" class="wrap" hidden>
  <div class="chuui" id="chuui">このページは<b id="dareno">亀井さん</b>専用です。アドレスは他の人に渡さないでください。</div>
  <section id="tsukutta-waku" hidden>
    <h2>亀井さんの頼みで作った物</h2>
    <p class="r" style="color:var(--sub);font-size:14.5px;margin:-4px 0 10px">「入れて」を押すと、その部屋の主任へ知らせが届き、主任が本番に入れます。</p>
    <div class="tsukutta" id="tsukutta"></div>
  </section>
  <h2>部屋</h2>
  <div class="heya-ichiran" id="heya-ichiran"></div>
  <h2>会社全体の成果物</h2>
  <ul class="seika" id="zentai"></ul>
  <p style="height:30px"></p>
</main>

<main id="heya-naka" class="wrap" hidden>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-k" aria-selected="true">チャット</button>
    <button role="tab" id="tab-s" aria-selected="false">成果物</button>
  </div>
  <div class="naka">
    <section class="kaiwa-waku mieru" id="kaiwa-waku">
      <div class="shita" style="flex:1;display:flex;flex-direction:column;min-height:0">
        <div class="kaiwa" id="kaiwa"><button class="mae" id="mae" hidden>もっと前を見る</button></div>
        <button class="atarashii" id="atarashii">新しい書き込み ↓</button>
      </div>
      <div class="kaku">
        <textarea id="kakiran" maxlength="1000" placeholder="この部屋に書き込む（例：ここをこう直せる？）"></textarea>
        <button id="okuru">送る</button>
      </div>
      <div class="kaku-note" id="kaku-note">書いた事はこの部屋の AI に届きます。作った物は試しの版に置かれ、社長が見てから本番に入ります。</div>
    </section>
    <section class="seika-waku" id="seika-waku">
      <div class="ugoki" id="ugoki"></div>
      <ul class="seika" id="seika"></ul>
    </section>
  </div>
</main>

<div class="yomu" id="yomu">
  <header class="top"><div class="wrap"><span class="logo">KAI</span><h1 id="yomu-dai">読む</h1><button class="modoru" id="yomu-tojiru">← もどる</button></div></header>
  <div class="naka2" id="yomu-naka"><article id="yomu-honbun"></article></div>
</div>

<script>
(function(){
"use strict";
var BASE = location.pathname.replace(/\/+$/, "") + "/";
var $ = function(id){ return document.getElementById(id); };
var DARE = "kamei", HEYA = null, SAIGO = -1, SAISHO = 0, TIMER = null, OKUTTA = {}, ICHI = null, NAMAE = {};

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function hi(at){ if(!at) return ""; var d = new Date(at); if(isNaN(d)) return ""; var n = new Date();
  var hm = ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  return (d.toDateString() === n.toDateString()) ? hm : (d.getMonth()+1)+"/"+d.getDate()+" "+hm; }
function api(p, opt){ return fetch(BASE + "api/" + p, Object.assign({cache:"no-store"}, opt||{})).then(function(r){ return r.json().then(function(j){ j._status = r.status; return j; }); }); }

// やさしい書式（文字をすべて消毒してから、太字・リンク・箇条書きだけ戻す）
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/(^|[\s（(「])(https?:\/\/[^\s<）)」]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return s;
}
function md(t){
  var L = String(t||"").replace(/\r/g,"").split("\n"), out = [], li = null, tb = null, pre = null;
  function owari(){ if(li){ out.push("</"+li+">"); li = null; } if(tb){ out.push("</table>"); tb = null; } }
  L.forEach(function(l){
    if(/^```/.test(l)){ if(pre === null){ owari(); pre = []; } else { out.push("<pre>"+esc(pre.join("\n"))+"</pre>"); pre = null; } return; }
    if(pre !== null){ pre.push(l); return; }
    var m;
    if(/^\s*\|.*\|\s*$/.test(l)){
      if(/^\s*\|[\s:\-|]+\|\s*$/.test(l)) return;
      if(!tb){ owari(); out.push("<table>"); tb = 1; }
      out.push("<tr>"+l.trim().replace(/^\||\|$/g,"").split("|").map(function(c){ return "<td>"+inline(c.trim())+"</td>"; }).join("")+"</tr>"); return;
    }
    if((m = l.match(/^(#{1,4})\s+(.*)/))){ owari(); var n = Math.min(4, m[1].length + 1); out.push("<h"+n+">"+inline(m[2])+"</h"+n+">"); return; }
    if((m = l.match(/^\s*(?:[-*・]|\d+[.)])\s+(.*)/))){ var k = /^\s*\d/.test(l) ? "ol" : "ul"; if(li !== k){ owari(); out.push("<"+k+">"); li = k; } out.push("<li>"+inline(m[1])+"</li>"); return; }
    if(!l.trim()){ owari(); return; }
    owari(); out.push("<p>"+inline(l)+"</p>");
  });
  if(pre !== null) out.push("<pre>"+esc(pre.join("\n"))+"</pre>");
  owari();
  return out.join("");
}

// ---------- 入口 ----------
function iriguchi(){
  HEYA = null; stopPoll();
  $("iriguchi").hidden = false; $("heya-naka").hidden = true; $("modoru").hidden = true;
  $("dai").textContent = "KAI Lab 部屋のようす";
  document.title = "KAI Lab 部屋のようす";
  api("ichiran").then(function(j){
    if(j._status !== 200) return;
    DARE = j.dare;
    $("dareno").textContent = DARE === "shachou" ? "社長" : "亀井さん";
    var box = $("heya-ichiran");
    j.heya.forEach(function(h){
      NAMAE[h.id] = h.dai;
      var a = box.querySelector('[data-key="'+h.id+'"]');
      if(!a){ a = document.createElement("a"); a.className = "heya"; a.dataset.key = h.id; a.href = "#/h/" + h.id; box.appendChild(a); }
      var ima = h.ugoki && (Date.now() - new Date(h.ugoki)) < 90000;
      var html = "<b>"+esc(h.dai.replace(/^【主任】/,""))+(h.kakari?"":"<span style='font-weight:400;font-size:14px;color:var(--sub)'> の部屋</span>")+(ima?"<span class='ima'>いま作業中</span>":"")+"</b>"
        + "<span class='s'>"+(h.ugoki ? "最後に動いた " + esc(hi(h.ugoki)) : "まだ記録がありません")+"</span>"
        + "<span class='s'>"+esc(h.saigo || "")+"</span>";
      if(a.innerHTML !== html) a.innerHTML = html;
    });
    seikaHyou($("zentai"), j.seika, true);
    if(DARE === "shachou"){ $("tsukutta-waku").hidden = false; tsukuttaYomu(); }
  });
}

function seikaHyou(ul, list, heyaMo){
  if(!list.length){ if(!ul.children.length) ul.innerHTML = "<li class='kara'>まだありません</li>"; return; }
  var kara = ul.querySelector(".kara"); if(kara) kara.parentNode.removeChild(kara);
  var keys = {};
  list.forEach(function(x, i){
    var key = x.fid ? x.heya+"|"+x.fid : (x.url || ("t"+x.tsukutta));
    keys[key] = 1;
    var li = ul.querySelector('[data-key="'+CSS.escape(key)+'"]');
    if(!li){ li = document.createElement("li"); li.dataset.key = key; }
    var href = x.fid ? "#/h/"+x.heya+"/f/"+encodeURIComponent(x.fid) : (x.url || "");
    var inner = "<span class='fuda"+(x.tsukutta?" k":"")+"'>"+esc(x.shurui)+"</span><span class='t'>"+esc(x.namae)+(heyaMo?" <span style='color:var(--sub);font-size:13.5px'>（"+esc(x.heya_na)+"）</span>":"")+(x.joutai?" <span style='color:var(--sub);font-size:13.5px'>・"+esc(x.joutai)+"</span>":"")+"</span><span class='h'>"+esc(hi(x.at))+"</span>";
    var html = href ? "<a href='"+esc(href)+"'"+(x.url?" target='_blank' rel='noopener noreferrer'":"")+">"+inner+"</a>" : "<span class='na'>"+inner+"</span>";
    if(li.innerHTML !== html) li.innerHTML = html;
    if(ul.children[i] !== li) ul.insertBefore(li, ul.children[i] || null);
  });
  Array.prototype.slice.call(ul.children).forEach(function(li){ if(li.dataset.key && !keys[li.dataset.key]) ul.removeChild(li); });
}

function tsukuttaYomu(){
  api("tsukutta").then(function(j){
    if(j._status !== 200) return;
    var box = $("tsukutta");
    if(!j.tsukutta.length){ box.innerHTML = "<div class='tk r'>まだありません。亀井さんが部屋に書き込んで、部屋の AI が作ると、ここに並びます。</div>"; return; }
    var kara = box.querySelector(".r.tk"); if(kara) box.removeChild(kara);
    j.tsukutta.forEach(function(x, i){
      var key = "i"+x.i, d = box.querySelector('[data-key="'+key+'"]');
      if(!d){ d = document.createElement("div"); d.className = "tk"; d.dataset.key = key; }
      var html = "<b>"+esc(x.nani)+"</b><div class='r'>"+esc(String(x.heya||"").replace(/^【主任】/,""))+" ・ "+esc(hi(x.at))+" ・ 状態："+esc(x.joutai||"試し中")+"</div>"
        + (x.tanomi ? "<div>亀井さんの頼み：「"+esc(x.tanomi)+"」</div>" : "")
        + (x.oki ? "<div class='r'>置き場："+esc(x.oki)+"</div>" : "")
        + (x.kekka ? "<div class='r'>試した結果："+esc(x.kekka)+"</div>" : "")
        + ((x.joutai||"試し中") === "試し中" ? "<div class='bt'><button data-i='"+x.i+"' data-k='irete'>入れて</button><button class='mi' data-i='"+x.i+"' data-k='miokuri'>見送り</button></div>" : "");
      if(d.innerHTML !== html) d.innerHTML = html;
      if(box.children[i] !== d) box.insertBefore(d, box.children[i] || null);
    });
  });
}
$("tsukutta").addEventListener("click", function(e){
  var b = e.target.closest("button[data-i]"); if(!b) return;
  var k = b.dataset.k;
  if(!confirm(k === "irete" ? "本番に入れるよう、その部屋の主任へ知らせます。よろしいですか？" : "見送りにします。よろしいですか？")) return;
  b.disabled = true;
  api("kettei", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({i: +b.dataset.i, kettei: k})})
    .then(function(j){ if(!j.ok) alert("出来ませんでした：" + (j.err||"")); tsukuttaYomu(); });
});

// ---------- 部屋の中 ----------
function heyaHiraku(id){
  if(HEYA !== id){
    HEYA = id; SAIGO = -1; SAISHO = 0; OKUTTA = {};
    var k = $("kaiwa"); Array.prototype.slice.call(k.querySelectorAll(".m,.sagyou,details")).forEach(function(n){ k.removeChild(n); });
    $("seika").innerHTML = "";
    $("mae").hidden = true;
  }
  $("iriguchi").hidden = true; $("heya-naka").hidden = false; $("modoru").hidden = false;
  $("dai").textContent = (NAMAE[id] || "部屋").replace(/^【主任】/, "") ;
  chat(true); seikaYomu(); startPoll();
}

function startPoll(){ stopPoll(); TIMER = setInterval(function(){ if(!document.hidden){ chat(false); } }, 3000); ICHI = setInterval(function(){ if(!document.hidden) seikaYomu(); }, 60000); }
function stopPoll(){ if(TIMER) clearInterval(TIMER); if(ICHI) clearInterval(ICHI); TIMER = ICHI = null; }

function shitaNi(){ var k = $("kaiwa"); return k.scrollHeight - k.scrollTop - k.clientHeight < 80; }
function shitaHe(){ var k = $("kaiwa"); k.scrollTop = k.scrollHeight; $("atarashii").style.display = "none"; }
$("kaiwa").addEventListener("scroll", function(){ if(shitaNi()) $("atarashii").style.display = "none"; });
$("atarashii").addEventListener("click", shitaHe);

function itemNode(x){
  var d;
  if(x.dare === "sagyou"){
    d = document.createElement("div"); d.className = "sagyou";
    d.textContent = "🔧 作業中（" + x.nani.slice(0,4).join("・") + (x.kazu > 1 ? " ほか " + x.kazu + "回" : "") + "）";
  } else if(x.dare === "shirase"){
    d = document.createElement("details"); d.className = "shirase";
    d.innerHTML = "<summary>📨 " + esc(x.kara || "ほかの部屋") + "から ・ " + esc(hi(x.at)) + "</summary><div>" + esc(x.text) + "</div>";
  } else {
    d = document.createElement("div"); d.className = "m " + x.dare;
    d.innerHTML = "<div class='w'>" + (x.dare === "hito" ? "社長" : "AI") + " ・ " + esc(hi(x.at)) + "</div><div class='b'>" + md(x.text) + "</div>";
  }
  d.dataset.key = "n" + x.n; d.dataset.at = x.at || "";
  return d;
}

function okuttaNode(x){
  var key = "k" + x.id, d = $("kaiwa").querySelector('[data-key="'+key+'"]'), nw = !d;
  if(!d){ d = document.createElement("div"); d.className = "m kamei"; d.dataset.key = key; d.dataset.at = x.at; }
  var j = x.joutai === "todoita" ? (x.yonda ? "✓✓ 部屋のAIが読みました" : "✓ 部屋に届きました（AIが読むのを待っています）") : (x.nemuri ? "部屋が休んでいます。部屋が動いた時に届けます" : "届けています…");
  var html = "<div class='w'>" + (x.dare === "shachou" ? "社長" : "亀井さん") + " ・ " + esc(hi(x.at)) + "</div><div class='b'>" + md(x.text) + "</div><div class='joutai'>" + j + "</div>";
  if(d.innerHTML !== html) d.innerHTML = html;
  return nw ? d : null;
}

function ireru(node){
  // 時刻の順に差し込む（多くは一番下）
  var k = $("kaiwa"), at = node.dataset.at, c = k.lastElementChild;
  while(c && c.dataset && c.dataset.at && at && c.dataset.at > at && c.id !== "mae"){ c = c.previousElementSibling; }
  if(c && c.nextSibling) k.insertBefore(node, c.nextSibling); else if(c) k.appendChild(node); else k.appendChild(node);
}

function chat(hajime){
  var id = HEYA; if(!id) return;
  api("heya/" + id + "/chat?after=" + SAIGO).then(function(j){
    if(id !== HEYA || j._status !== 200) return;
    var shita = shitaNi(), atara = 0, k = $("kaiwa");
    $("dai").textContent = j.dai.replace(/^【主任】/, "");
    NAMAE[id] = j.dai;
    j.items.forEach(function(x){
      var old = k.querySelector('[data-key="n'+x.n+'"]');
      if(old){ var nn = itemNode(x); if(old.outerHTML !== nn.outerHTML) k.replaceChild(nn, old); return; }
      ireru(itemNode(x)); atara++;
      if(x.n > SAIGO) SAIGO = x.n;
    });
    j.okutta.forEach(function(x){ var n = okuttaNode(x); if(n){ ireru(n); atara++; } });
    if(hajime && j.items.length) SAISHO = j.items[0].n;
    $("mae").hidden = !(SAISHO > j.saisho);
    var ima = j.ugoki && (Date.now() - new Date(j.ugoki)) < 90000;
    $("ugoki").textContent = ima ? "● いま作業中です" : (j.ugoki ? "最後に動いた " + hi(j.ugoki) : "");
    if(hajime || shita) shitaHe(); else if(atara) $("atarashii").style.display = "block";
  });
}

$("mae").addEventListener("click", function(){
  var id = HEYA, k = $("kaiwa");
  api("heya/" + id + "/chat?before=" + SAISHO).then(function(j){
    if(id !== HEYA || !j.items.length) { $("mae").hidden = true; return; }
    var h0 = k.scrollHeight, top = k.scrollTop, ato = $("mae").nextSibling;
    j.items.forEach(function(x){ if(!k.querySelector('[data-key="n'+x.n+'"]')) k.insertBefore(itemNode(x), ato); });
    SAISHO = j.items[0].n;
    $("mae").hidden = !(SAISHO > j.saisho);
    k.scrollTop = top + (k.scrollHeight - h0);
  });
});

function seikaYomu(){
  var id = HEYA; if(!id) return;
  api("heya/" + id + "/seika").then(function(j){ if(id === HEYA && j._status === 200) seikaHyou($("seika"), j.seika, false); });
}

// 書き込み
var ta = $("kakiran");
ta.addEventListener("input", function(){ ta.style.height = "52px"; ta.style.height = Math.min(160, ta.scrollHeight) + "px"; });
$("okuru").addEventListener("click", function(){
  var t = ta.value.trim(); if(!t || !HEYA) return;
  var b = $("okuru"); b.disabled = true;
  api("heya/" + HEYA + "/kaku", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text: t})})
    .then(function(j){
      b.disabled = false;
      if(j.ok){ ta.value = ""; ta.style.height = "52px"; $("kaku-note").textContent = "送りました。部屋に届くまで1分ほどかかります。"; chat(false); setTimeout(shitaHe, 400); }
      else { $("kaku-note").textContent = "送れませんでした：" + (j.err || ""); }
    }).catch(function(){ b.disabled = false; $("kaku-note").textContent = "送れませんでした。電波の良い所でもう一度どうぞ。"; });
});

// タブ（狭い画面）
function tab(s){
  $("tab-k").setAttribute("aria-selected", s ? "false" : "true"); $("tab-s").setAttribute("aria-selected", s ? "true" : "false");
  $("kaiwa-waku").classList.toggle("mieru", !s); $("seika-waku").classList.toggle("mieru", !!s);
  if(!s) setTimeout(shitaHe, 0);
}
$("tab-k").addEventListener("click", function(){ tab(0); });
$("tab-s").addEventListener("click", function(){ tab(1); });

// 読む（報告書）
function yomu(id, fid){
  $("yomu").classList.add("hiraku");
  var nk = $("yomu-naka"); nk.innerHTML = "<article id='yomu-honbun'>読み込んでいます…</article>";
  $("yomu-dai").textContent = decodeURIComponent(fid).split("/").pop().replace(/\.(md|html)$/, "");
  var url = BASE + "api/heya/" + id + "/f?f=" + encodeURIComponent(decodeURIComponent(fid));
  if(/\.html$/.test(decodeURIComponent(fid))){ nk.innerHTML = ""; var f = document.createElement("iframe"); f.setAttribute("sandbox", ""); f.src = url; f.style.height = "100%"; nk.appendChild(f); return; }
  fetch(url, {cache:"no-store"}).then(function(r){ return r.json(); }).then(function(j){
    var a = $("yomu-honbun"); a.innerHTML = md(j.md || "読めませんでした");
    var h = a.querySelector("h2"); if(h) $("yomu-dai").textContent = h.textContent;
  }).catch(function(){ $("yomu-honbun").textContent = "読めませんでした"; });
}
function yomuTojiru(){ $("yomu").classList.remove("hiraku"); }
$("yomu-tojiru").addEventListener("click", function(){ history.back(); });
$("modoru").addEventListener("click", function(){ location.hash = "#/"; });

// 道（マウスの戻るボタン・スマホの戻るが効く）
function michi(){
  var h = location.hash.replace(/^#\/?/, "").split("/");
  if(h[0] === "h" && h[1]){
    if(h[2] === "f" && h[3]){ if(HEYA !== h[1]) heyaHiraku(h[1]); yomu(h[1], h.slice(3).join("/")); return; }
    yomuTojiru(); heyaHiraku(h[1]); return;
  }
  yomuTojiru(); iriguchi();
}
window.addEventListener("hashchange", michi);
document.addEventListener("visibilitychange", function(){ if(!document.hidden){ if(HEYA) chat(false); } });
// 入口に戻った時の札を最新に
setInterval(function(){ if(!HEYA && !document.hidden) iriguchi(); }, 30000);
api("ichiran").then(function(j){ (j.heya||[]).forEach(function(h){ NAMAE[h.id] = h.dai; }); michi(); });
})();
</script>
